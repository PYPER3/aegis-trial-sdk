name: Publish AEGIS Trial SDK to PyPI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tools
        run: python -m pip install --upgrade pip build twine

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build distribution
        run: python -m build

      - name: Validate distribution
        run: python -m twine check dist/*

      - name: Generate release checksums
        run: |
          python scripts/write_release_checksums.py \
            --output SHA256SUMS \
            dist/*.whl \
            dist/*.tar.gz

      - name: Preserve Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Preserve release checksums
        uses: actions/upload-artifact@v4
        with:
          name: aegis-trial-sdk-checksums
          path: SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Retrieve Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true