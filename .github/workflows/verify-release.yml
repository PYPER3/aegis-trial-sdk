name: Verify public SDK release artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/write_release_checksums.py --output dist/SHA256SUMS dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: public-sdk-release-artifacts
          path: dist/
          if-no-files-found: error
